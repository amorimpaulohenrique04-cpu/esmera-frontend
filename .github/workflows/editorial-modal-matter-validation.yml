name: Editorial media, product modal and Matter validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD_API_URL: https://esmeracms-green.vercel.app
      PORT: "8000"
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Format gallery contract files
        run: >-
          deno fmt --check
          islands/ProductModal.tsx
          lib/esmera/productMediaPresentation.ts
          lib/payload/adapters.ts
          lib/payload/media.ts
          lib/payload/types.ts
          scripts/ci/editorial-modal-smoke.mjs
          scripts/ci/product-modal-media-fidelity.mjs
          tests/product/product_modal_contract_test.ts
          tests/product/product_modal_cache_contract_test.ts
          tests/product/product_media_presentation_test.ts
          tests/payload/media_test.ts
          tests/payload/storefront_products_test.ts

      - name: Generate Deco metadata
        run: deno task gen

      - name: Verify generated Deco metadata
        shell: bash
        run: |
          if ! git diff --quiet -- .deco/blocks/esmera.json manifest.gen.ts; then
            echo "Generated Deco metadata is not committed."
            git diff -- .deco/blocks/esmera.json manifest.gen.ts
            exit 1
          fi

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno check dev.ts main.ts

      - name: Tests
        run: deno test -A

      - name: Build
        run: deno task build

      - name: Start preview
        shell: bash
        run: |
          deno task preview > /tmp/esmera-preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esmera-preview.log
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Smoke test editorial modal and Matter
        run: node scripts/ci/editorial-modal-smoke.mjs

      - name: Validate full storefront media, pagination and cookies
        run: node scripts/ci/storefront-production-smoke.mjs

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-modal-matter-evidence
          path: smoke-artifacts
          if-no-files-found: ignore
