name: Product modal media fidelity validation

on:
  push:
    branches: [main]
    paths:
      - "components/esmera/ProductMediaViewer.tsx"
      - "components/esmera/StorefrontLayout.tsx"
      - "islands/ProductModal.tsx"
      - "lib/esmera/productMediaPresentation.ts"
      - "lib/payload/media.ts"
      - "routes/_app.tsx"
      - "components/esmera/ObjectCard.tsx"
      - "static/esmera-card-image-health.js"
      - "static/esmera-product-card.css"
      - "scripts/ci/card-image-health-smoke.mjs"
      - "static/esmera-master.css"
      - "static/esmera-commerce-refine.css"
      - "static/esmera-hotfix-product-modal.css"
      - "static/esmera-product-modal-v2.css"
      - "static/esmera-product-modal-frame-fix.css"
      - "static/esmera-product-media-v16.css"
      - "scripts/ci/product-modal-media-fidelity.mjs"
      - "tests/product/**"
      - "deno.json"
      - "deno.lock"
      - "dev.ts"
      - "main.ts"
      - "fresh.gen.ts"
      - ".github/workflows/product-modal-media-fidelity-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "components/esmera/ProductMediaViewer.tsx"
      - "components/esmera/StorefrontLayout.tsx"
      - "islands/ProductModal.tsx"
      - "lib/esmera/productMediaPresentation.ts"
      - "lib/payload/media.ts"
      - "routes/_app.tsx"
      - "components/esmera/ObjectCard.tsx"
      - "static/esmera-card-image-health.js"
      - "static/esmera-product-card.css"
      - "scripts/ci/card-image-health-smoke.mjs"
      - "static/esmera-master.css"
      - "static/esmera-commerce-refine.css"
      - "static/esmera-hotfix-product-modal.css"
      - "static/esmera-product-modal-v2.css"
      - "static/esmera-product-modal-frame-fix.css"
      - "static/esmera-product-media-v16.css"
      - "scripts/ci/product-modal-media-fidelity.mjs"
      - "tests/product/**"
      - "deno.json"
      - "deno.lock"
      - "dev.ts"
      - "main.ts"
      - "fresh.gen.ts"
      - ".github/workflows/product-modal-media-fidelity-validation.yml"

permissions:
  contents: read

jobs:
  media-fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAYLOAD_API_URL: https://esmeracms-green.vercel.app
      PORT: "8000"
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Format product media files
        run: >-
          deno fmt --check
          components/esmera/ProductMediaViewer.tsx
          islands/ProductModal.tsx
          lib/esmera/productMediaPresentation.ts
          lib/payload/media.ts
          routes/_app.tsx
          static/esmera-product-media-v16.css
          tests/product/product_modal_contract_test.ts
          tests/product/product_modal_cache_contract_test.ts
          tests/product/product_media_presentation_test.ts

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno check dev.ts main.ts

      - name: Unit and contract tests
        run: deno test -A

      - name: Build
        run: deno task build

      - name: Start preview
        shell: bash
        run: |
          deno task preview > /tmp/esmera-media-fidelity-preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esmera-media-fidelity-preview.log
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Validate media fidelity and viewer interactions
        run: node scripts/ci/product-modal-media-fidelity.mjs

      - name: Validate cards, hover failure and Carregar mais
        run: node scripts/ci/card-image-health-smoke.mjs

      - name: Upload media fidelity evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: product-modal-media-fidelity-evidence
          path: media-fidelity-artifacts
          if-no-files-found: warn
          retention-days: 7
