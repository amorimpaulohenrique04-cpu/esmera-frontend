name: Product modal two-image validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  two-image-modal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PAYLOAD_API_URL: https://esmeracms-green.vercel.app
      PORT: "8000"
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Product media contracts
        run: >-
          deno test -A
          tests/product/product_modal_cache_contract_test.ts
          tests/product/product_media_presentation_test.ts

      - name: Build
        run: deno task build

      - name: Start preview
        shell: bash
        run: |
          deno task preview > /tmp/esmera-two-image-preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esmera-two-image-preview.log
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Validate two-image and mixed-ratio behavior
        run: node scripts/ci/product-modal-media-fidelity.mjs

      - name: Upload two-image evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: product-modal-two-image-evidence
          path: media-fidelity-artifacts
          if-no-files-found: warn
          retention-days: 7
